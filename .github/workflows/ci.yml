name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p usage-core
      - run: cargo clippy -p usage-core --all-targets -- -D warnings

  app:
    name: Build app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build desktop widget
        if: runner.os == 'macOS'
        run: sh macos/build-widget.sh
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: 22
      - name: Bundle the app and check the widget inside it
        if: runner.os == 'macOS'
        run: |
          npm ci
          npx tauri build --debug --bundles app
          app="target/debug/bundle/macos/Claude Usage.app"
          test -x "$app/Contents/MacOS/widget-reload"
          plutil -p "$app/Contents/PlugIns/UsageWidget.appex/Contents/Info.plist" | grep widgetkit-extension
          test "$(plutil -extract LSUIElement raw "$app/Contents/Info.plist")" = true
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app/Contents/PlugIns/UsageWidget.appex" 2>/dev/null | grep app-sandbox
