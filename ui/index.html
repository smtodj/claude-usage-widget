<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude 사용량</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Claude 남은 사용량</h1>
      <button id="refresh" type="button">새로고침</button>
    </header>
    <p id="error" class="error" hidden></p>
    <main id="windows"><p class="muted">불러오는 중…</p></main>
    <footer>
      <p id="checked" class="muted"></p>
      <button id="account" type="button" hidden></button>
    </footer>
    <section id="gemini" class="provider" hidden>
      <h2>Gemini 남은 사용량</h2>
      <p id="gemini-error" class="error" hidden></p>
      <div id="gemini-windows"></div>
      <footer>
        <p id="gemini-checked" class="muted"></p>
        <button id="gemini-account" type="button">Gemini 로그아웃</button>
      </footer>
    </section>
    <p id="gemini-login" class="provider" hidden>
      <button type="button">Gemini로 로그인</button>
    </p>
    <script src="main.js"></script>
  </body>
</html>
