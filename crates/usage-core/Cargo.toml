[package]
name = "usage-core"
description = "Reads the remaining Claude plan usage (5-hour session and weekly limits)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json", "proxy-from-env"] }
